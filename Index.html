<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteFlow</title>
    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#121212;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .box{
            text-align:center;
            background:#1e1e1e;
            padding:40px;
            border-radius:15px;
            width:320px;
        }
        h1{margin-bottom:10px;}
        textarea{
            width:100%;
            height:200px;
            margin-top:20px;
            border:none;
            border-radius:10px;
            padding:10px;
            resize:none;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>📝 NoteFlow</h1>
    <p>Bienvenue sur votre bloc-notes.</p>
    <textarea placeholder="Écrivez ici..."></textarea>
</div>

</body>
</html>
