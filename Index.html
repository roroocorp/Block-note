<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteFlow</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    width:90%;
    max-width:700px;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#2563eb;
}

textarea{
    width:100%;
    height:350px;
    margin-top:15px;
    border:2px solid #ddd;
    border-radius:10px;
    padding:15px;
    font-size:16px;
    resize:none;
    outline:none;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="card">
<h1>📝 NoteFlow</h1>

<textarea id="note" placeholder="Écris tes notes ici..."></textarea>

<br>

<button onclick="saveNote()">💾 Enregistrer</button>
<button onclick="clearNote()">🗑 Effacer</button>

</div>

<script>
const note=document.getElementById("note");

note.value=localStorage.getItem("note")||"";

function saveNote(){
    localStorage.setItem("note",note.value);
    alert("Note enregistrée !");
}

function clearNote(){
    note.value="";
    localStorage.removeItem("note");
}
</script>

</body>
</html>
