<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

/* GARDE TON STYLE ORIGINAL ICI */
/* On garde exactement ton CSS de départ */

</style>

</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>


<header>

<div class="logo-dot">
⚡
</div>

<h1>
Daily Life <span>Ultra</span> IA
</h1>

<div id="time">
00:00:00
</div>

</header>


<div id="topNav">

<div class="navBox active" onclick="showPage('home',this)">
🏠 Accueil
</div>

<div class="navBox" onclick="showPage('ia',this)">
🤖 IA
</div>

<div class="navBox" onclick="showPage('promo',this)">
🎁 Promo
</div>

</div>



<!-- PAGE ACCUEIL -->

<div id="home" class="page active">


<div class="stat-row">

<div class="stat-box">
<div class="n" id="statTotal">0</div>
<div class="l">Tâches</div>
</div>


<div class="stat-box">
<div class="n" id="statDone">0</div>
<div class="l">Terminées</div>
</div>


<div class="stat-box">
<div class="n" id="statLeft">0</div>
<div class="l">Restantes</div>
</div>


</div>




<div class="card">


<div class="card-title">
<div class="icon">
🎨
</div>

Couleur
</div>


<div class="swatches">


<div class="swatch selected"
data-color="#10b981"
style="background:#10b981">
</div>


<div class="swatch"
data-color="#3b82f6"
style="background:#3b82f6">
</div>


<div class="swatch"
data-color="#a855f7"
style="background:#a855f7">
</div>


<div class="swatch"
data-color="#f97316"
style="background:#f97316">
</div>


</div>


</div>





<div class="card">


<div class="card-title">

<div class="icon">
🌍
</div>

Langue

</div>



<select id="languageSelect">


<option value="fr">
🇫🇷 Français
</option>


<option value="en">
🇬🇧 English
</option>


<option value="es">
🇪🇸 Español
</option>


<option value="de">
🇩🇪 Deutsch
</option>


<option value="zh">
🇨🇳 中文
</option>


</select>


</div>






<div class="card">


<div class="card-title">

<div class="icon">
📝
</div>

<span id="lblTasks">
Notes du jour
</span>


</div>



<div style="display:flex;gap:8px;">


<input id="taskInput"
placeholder="Écrire une note...">


<button class="btn"
onclick="addTask()"
style="width:auto">

+

</button>


</div>



<div id="taskList"></div>


</div>



</div>





<!-- PAGE IA -->


<div id="ia" class="page">


<div class="ia-page-inner">


<div id="chatContainer">


<div class="message iaMsg">

Salut 👋 Je suis ton IA perso.

</div>


</div>



<div id="iaInputArea">


<textarea id="iaInput"
placeholder="Écris un message..."></textarea>


<button class="sendBtn"
onclick="askIA()">

➤

</button>


</div>


</div>


</div>




<script>


// HORLOGE

function tick(){

let d=new Date();

document.getElementById("time").textContent =
d.toLocaleTimeString("fr-FR");

}

tick();

setInterval(tick,1000);





// NAVIGATION

function showPage(id,el){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));


document.getElementById(id)
.classList.add("active");


document.querySelectorAll(".navBox")
.forEach(b=>b.classList.remove("active"));


el.classList.add("active");

}






// COULEURS (sauvegarde)

const savedColor =
localStorage.getItem("dlColor") || "#10b981";


function applyColor(color){

document.documentElement
.style.setProperty("--accent",color);

}



document.querySelectorAll(".swatch")
.forEach(s=>{


if(s.dataset.color===savedColor){

s.classList.add("selected");

applyColor(savedColor);

}


s.onclick=()=>{


document.querySelectorAll(".swatch")
.forEach(x=>x.classList.remove("selected"));


s.classList.add("selected");


localStorage.setItem(
"dlColor",
s.dataset.color
);


applyColor(s.dataset.color);


};


});






// NOTES

let tasks =
JSON.parse(localStorage.getItem("dlTasks")) || [];



function saveTasks(){

localStorage.setItem(
"dlTasks",
JSON.stringify(tasks)
);

}




function renderTasks(){

let list =
document.getElementById("taskList");


list.innerHTML="";


tasks.forEach((t,i)=>{


list.innerHTML += `

<div class="task ${t.done?'done':''}">


<div class="task-check"
onclick="toggleTask(${i})">

${t.done?'✓':''}

</div>


<div class="task-text">

${t.text}

</div>



<div class="task-del"
onclick="deleteTask(${i})">

🗑️

</div>


</div>

`;

});



document.getElementById("statTotal")
.textContent=tasks.length;


document.getElementById("statDone")
.textContent=
tasks.filter(t=>t.done).length;


document.getElementById("statLeft")
.textContent=
tasks.filter(t=>!t.done).length;


}



function addTask(){


let input =
document.getElementById("taskInput");


if(input.value.trim()=="")
return;



tasks.unshift({

text:input.value,

done:false

});


saveTasks();


input.value="";


renderTasks();


}



function toggleTask(i){

tasks[i].done =
!tasks[i].done;


saveTasks();

renderTasks();

}



function deleteTask(i){

tasks.splice(i,1);


saveTasks();

renderTasks();


}



renderTasks();






// IA SIMPLE


function askIA(){


let input =
document.getElementById("iaInput");


let chat =
document.getElementById("chatContainer");


if(input.value.trim()=="")
return;



chat.innerHTML += `

<div class="message userMsg">

${input.value}

</div>


<div class="message iaMsg">

Je suis là pour t'aider 🤖

</div>

`;



input.value="";


chat.scrollTop=chat.scrollHeight;


}





// LANGUES

document.getElementById("languageSelect")
.addEventListener("change",function(){


localStorage.setItem(
"language",
this.value
);


if(this.value==="zh"){

document.getElementById("lblTasks")
.textContent="今天的任务";


}

else if(this.value==="en"){

document.getElementById("lblTasks")
.textContent="Today's notes";


}

else{

document.getElementById("lblTasks")
.textContent="Notes du jour";


}


});




</script>


</body>
</html>
