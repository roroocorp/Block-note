<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#10b981;
    --accent2:#059669;
    --bg1:#081525;
    --bg2:#102746;

    --glass:rgba(255,255,255,.07);
    --glass2:rgba(255,255,255,.13);

    --border:rgba(255,255,255,.12);

    --text:#f0fdf4;
    --muted:rgba(255,255,255,.55);

    --radius:20px;
    --radius-sm:14px;
}


body{

    min-height:100vh;

    background:
    radial-gradient(circle at top right,#12395a,transparent 35%),
    linear-gradient(160deg,var(--bg1),var(--bg2));

    color:var(--text);

    font-family:'DM Sans',sans-serif;

    display:flex;
    flex-direction:column;

    overflow-x:hidden;

}


/* =========================
   BACKGROUND ORBS
========================= */


.orb{

    position:fixed;

    border-radius:50%;

    filter:blur(90px);

    opacity:.25;

    pointer-events:none;

    z-index:0;

}


.orb1{

    width:350px;
    height:350px;

    top:-120px;
    right:-100px;

    background:var(--accent);

}


.orb2{

    width:300px;
    height:300px;

    bottom:-100px;
    left:-100px;

    background:var(--accent2);

}



/* =========================
   HEADER
========================= */


header{

    position:relative;

    z-index:5;

    display:flex;

    align-items:center;

    gap:12px;

    padding:18px;

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(15px);

}


.logo{

    width:38px;
    height:38px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

    background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));

}


h1{

    font-family:'Syne',sans-serif;

    font-size:18px;

    font-weight:800;

    letter-spacing:-.5px;

}


h1 span{

    color:var(--accent);

}


#time{

    margin-left:auto;

    padding:6px 12px;

    border-radius:30px;

    background:var(--glass);

    border:1px solid var(--border);

    color:var(--muted);

    font-size:13px;

}



/* =========================
   NAVIGATION
========================= */


#topNav{

    position:relative;

    z-index:5;

    display:flex;

    gap:10px;

    padding:14px;

}


.navBox{

    flex:1;

    text-align:center;

    padding:12px 5px;

    border-radius:var(--radius-sm);

    background:var(--glass);

    border:1px solid var(--border);

    color:var(--muted);

    cursor:pointer;

    transition:.25s;

    font-size:14px;

}


.navBox:hover{

    background:var(--glass2);

}


.navBox.active{

    background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));

    color:white;

    font-weight:700;

}



/* =========================
   PAGES
========================= */


.page{

    display:none;

    flex-direction:column;

    gap:14px;

    padding:14px;

    position:relative;

    z-index:2;

}


.page.active{

    display:flex;

}



/* =========================
   CARDS
========================= */


.card{

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:18px;

    backdrop-filter:blur(12px);

}


.card-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

    font-family:'Syne',sans-serif;

    font-weight:700;

}


.icon{

    width:30px;

    height:30px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:10px;

    background:var(--glass2);

}
