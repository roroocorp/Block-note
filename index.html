<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Notes IA</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#071b2d,#0d334b,#0e5d63);
color:white;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#1dd1a1;
}

.time{
background:rgba(255,255,255,.1);
padding:10px 18px;
border-radius:20px;
}

nav{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:20px;
}

nav button{
background:#24384d;
border:none;
color:white;
padding:15px;
border-radius:18px;
font-size:16px;
cursor:pointer;
transition:.2s;
}

nav button:hover,
nav button.active{
background:#18c78f;
}

.page{
display:none;
}

.page.active{
display:block;
}

.card{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(10px);
border-radius:25px;
padding:20px;
margin-bottom:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px;
}

.stat{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:20px;
text-align:center;
}

.stat h2{
color:#19d49c;
font-size:35px;
}

.colors{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:15px;
}

.color{
width:55px;
height:55px;
border-radius:15px;
cursor:pointer;
border:3px solid white;
}

textarea{
width:100%;
height:220px;
border:none;
border-radius:15px;
padding:15px;
font-size:17px;
resize:none;
margin-top:15px;
}

.send{
margin-top:15px;
width:100%;
padding:15px;
background:#18c78f;
color:white;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
}

select,input{
margin-top:15px;
padding:12px;
border-radius:10px;
border:none;
}

.reset{
width:100%;
padding:15px;
background:#ff4d4d;
color:white;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="logo">⚡ Daily Notes IA</div>
<div class="time" id="clock">00:00:00</div>
</header>

<nav>
<button class="active" onclick="openPage('home',this)">🏠 Accueil</button>
<button onclick="openPage('ia',this)">🤖 IA</button>
<button onclick="openPage('promo',this)">🎁 Promo</button>
<button onclick="openPage('settings',this)">⚙️ Paramètres</button>
</nav>

<!-- ACCUEIL -->
<div class="page active" id="home">

<div class="stats">
<div class="stat"><h2 id="count">0</h2>Notes</div>
<div class="stat"><h2>✓</h2>Sauvegarde</div>
<div class="stat"><h2>🌍</h2>Langue</div>
</div>

<div class="card">
<h2>🎨 Thème</h2>

<div class="colors">
<div class="color" style="background:#18c78f" onclick="theme('#18c78f')"></div>
<div class="color" style="background:#3b82f6" onclick="theme('#3b82f6')"></div>
<div class="color" style="background:#9333ea" onclick="theme('#9333ea')"></div>
<div class="color" style="background:#f97316" onclick="theme('#f97316')"></div>
<div class="color" style="background:#ec4899" onclick="theme('#ec4899')"></div>
<div class="color" style="background:#ef4444" onclick="theme('#ef4444')"></div>
</div>

</div>

<div class="card">
<h2>🌍 Langue</h2>

<select id="lang">
<option>🇫🇷 Français</option>
<option>🇬🇧 English</option>
<option>🇪🇸 Español</option>
<option>🇩🇪 Deutsch</option>
</select>

</div>

<div class="card">

<h2>📝 Bloc-notes</h2>

<textarea id="note" placeholder="Écris ici..."></textarea>

<button class="send" onclick="send()">📤 Envoyer</button>

</div>

</div>

<!-- IA -->

<div class="page" id="ia">

<div class="card">

<h2>🤖 IA</h2>

<p id="result">
Aucune note envoyée.
</p>

</div>

</div>

<!-- PROMO -->

<div class="page" id="promo">

<div class="card">

<h2>🎁 Code Promo</h2>

<input id="promoCode" placeholder="Entrer un code">

<button class="send" onclick="promo()">
Valider
</button>

<p id="promoResult"></p>

</div>

</div>

<!-- PARAMETRES -->

<div class="page" id="settings">

<div class="card">

<h2>⚙️ Paramètres</h2>

<button class="reset" onclick="resetData()">
🗑 Réinitialiser la sauvegarde
</button>

</div>

</div>

<script>

function openPage(id,b){

document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));

b.classList.add("active");

}

const note=document.getElementById("note");

note.value=localStorage.getItem("note")||"";

document.getElementById("count").innerHTML=note.value.length;

note.oninput=function(){

localStorage.setItem("note",this.value);

document.getElementById("count").innerHTML=this.value.length;

}

function send(){

document.getElementById("result").innerHTML="<b>Votre note :</b><br><br>"+note.value;

openPage("ia",document.querySelectorAll("nav button")[1]);

}

function theme(c){

document.querySelector(".logo").style.color=c;

localStorage.setItem("theme",c);

}

let t=localStorage.getItem("theme");

if(t){

document.querySelector(".logo").style.color=t;

}

function promo(){

let c=document.getElementById("promoCode").value;

document.getElementById("promoResult").innerHTML=

c=="PROMO2026"?"✅ Code accepté":"❌ Code invalide";

}

function resetData(){

if(confirm("Supprimer toutes les données ?")){

localStorage.clear();

location.reload();

}

}

setInterval(function(){

let d=new Date();

document.getElementById("clock").innerHTML=d.toLocaleTimeString();

},1000);

</script>

</body>
    </html>
