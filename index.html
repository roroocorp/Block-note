<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloc Notes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
}

header{
    background:#4a6cf7;
    color:white;
    text-align:center;
    padding:18px;
    font-size:28px;
}

nav{
    display:flex;
    justify-content:center;
    gap:10px;
    background:#222;
    padding:10px;
}

nav button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#444;
    color:white;
    transition:.2s;
}

nav button:hover{
    background:#666;
}

.page{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

textarea{
    width:100%;
    height:300px;
    padding:15px;
    border-radius:10px;
    resize:none;
    font-size:17px;
    margin-bottom:10px;
}

button.main{
    background:#4a6cf7;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:20px;
}

button.main:hover{
    opacity:0.9;
}

select,input{
    padding:10px;
    margin-top:10px;
    border-radius:8px;
}

#reponse{
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:10px;
}

footer{
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header id="titre">
Bloc Notes
</header>

<nav>
<button onclick="ouvrir('accueil')">🏠 Accueil</button>
<button onclick="ouvrir('ia')">🤖 IA</button>
<button onclick="ouvrir('promo')">🎁 Code Promo</button>
<button onclick="ouvrir('parametres')">⚙️ Paramètres</button>
</nav>

<!-- ACCUEIL -->
<div id="accueil" class="page active">

<h2>📝 Bloc Notes</h2>

<textarea id="note" placeholder="Écris ici..."></textarea>

<button class="main" onclick="envoyerIA()">📤 Envoyer</button>

<h3>🎨 Couleur</h3>
<input type="color" onchange="changerCouleur(this.value)">

<br><br>

<h3>🌍 Langue</h3>

<select onchange="changerLangue(this.value)">
<option value="fr">Français</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="de">Deutsch</option>
</select>

</div>

<!-- IA -->
<div id="ia" class="page">

<h2>🤖 IA</h2>

<div id="reponse">
Aucun message reçu.
</div>

</div>

<!-- CODE PROMO -->
<div id="promo" class="page">

<h2>🎁 Code Promo</h2>

<input id="code" placeholder="Entre un code promo">

<button class="main" onclick="promo()">Valider</button>

<p id="promoResultat"></p>

</div>

<!-- PARAMETRES -->
<div id="parametres" class="page">

<h2>⚙️ Paramètres</h2>

<button class="main" onclick="resetNotes()">
🗑 Réinitialiser la sauvegarde
</button>

</div>

<footer>
Bloc Notes 2026
</footer>

<script>

function ouvrir(page){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(page).classList.add("active");
}

// Sauvegarde automatique

let note=document.getElementById("note");

note.value=localStorage.getItem("note")||"";

note.oninput=function(){
localStorage.setItem("note",note.value);
}

// Envoyer vers IA

function envoyerIA(){

document.getElementById("reponse").innerHTML=
"<b>Votre note :</b><br><br>"+note.value;

ouvrir("ia");

}

// Couleur

function changerCouleur(c){

document.querySelector("header").style.background=c;

localStorage.setItem("couleur",c);

}

let couleur=localStorage.getItem("couleur");

if(couleur){

document.querySelector("header").style.background=couleur;

}

// Langues

function changerLangue(l){

let titre=document.getElementById("titre");

if(l=="fr") titre.innerHTML="Bloc Notes";
if(l=="en") titre.innerHTML="Notebook";
if(l=="es") titre.innerHTML="Bloc de Notas";
if(l=="de") titre.innerHTML="Notizblock";

localStorage.setItem("langue",l);

}

let langue=localStorage.getItem("langue");

if(langue){

changerLangue(langue);

}

// Code promo

function promo(){

let code=document.getElementById("code").value;

if(code=="PROMO2026"){

document.getElementById("promoResultat").innerHTML="✅ Code accepté";

}else{

document.getElementById("promoResultat").innerHTML="❌ Code invalide";

}

}

// Réinitialiser

function resetNotes(){

if(confirm("Supprimer toutes les données ?")){

localStorage.clear();

location.reload();

}

}

</script>

</body>
  </html>
