<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Notes IA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding-bottom:90px;
}

header{
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
background:#111827;
}

.container{
padding:15px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.card{
background:#1e293b;
border:1px solid #334155;
border-radius:18px;
padding:15px;
margin-bottom:15px;
}

textarea{
width:100%;
height:180px;
background:#0f172a;
color:white;
border:1px solid #334155;
border-radius:15px;
padding:15px;
resize:none;
font-size:16px;
margin-top:10px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-top:10px;
margin-bottom:10px;
}

.buttons{
display:flex;
gap:10px;
margin-top:12px;
}

button{
flex:1;
padding:13px;
border:none;
border-radius:14px;
font-size:16px;
cursor:pointer;
}

.save{
background:#22c55e;
color:white;
}

.send{
background:#3b82f6;
color:white;
}

.new{
width:100%;
margin-bottom:15px;
background:#22c55e;
color:white;
}

.noteCard{
background:#1e293b;
border-radius:16px;
padding:15px;
margin-bottom:10px;
cursor:pointer;
border:1px solid #334155;
}

.noteCard h3{
font-size:18px;
margin-bottom:5px;
}

.noteCard p{
color:#cbd5e1;
font-size:14px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
height:70px;
background:#111827;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #334155;
}

.bottom button{
background:none;
color:white;
font-size:14px;
border:none;
}

.bottom button:hover{
color:#22c55e;
}

</style>
</head>

<body>

<header>
📝 Daily Notes IA
</header>

<div class="container">

<!-- ACCUEIL -->

<div id="home" class="page active">

<button class="new">
➕ Nouvelle note
</button>

<div class="card">

<input
id="title"
placeholder="Titre de la note">

<textarea
id="content"
placeholder="Écris ta note..."></textarea>

<div class="buttons">

<button
class="save"
id="saveBtn">
💾 Enregistrer
</button>

<button
class="send"
id="sendBtn">
📤 Envoyer
</button>

</div>

</div>

<h2 style="margin-bottom:10px;">
📚 Mes notes
</h2>

<div id="notes">

<!-- Les petites cartes apparaîtront ici -->

</div>

</div>

<!-- IA -->

<div id="ia" class="page">

<div class="card">

<h2>🤖 IA</h2>

<p id="iaText">
Aucune note envoyée.
</p>

</div>

</div>

<!-- PROMO -->

<div id="promo" class="page">

<div class="card">

<h2>🎁 Code Promo</h2>

<input placeholder="Entrer un code">

<button class="save">
Valider
</button>

</div>

</div>

<!-- PARAMÈTRES -->

<div id="settings" class="page">

<div class="card">

<h2>⚙️ Paramètres</h2>

<button style="background:#ef4444;color:white;">
🗑 Réinitialiser les notes
</button>

</div>

</div>

</div>

<div class="bottom">

<button onclick="show('home')">
🏠<br>Accueil
</button>

<button onclick="show('ia')">
🤖<br>IA
</button>

<button onclick="show('promo')">
🎁<br>Promo
</button>

<button onclick="show('settings')">
⚙️<br>Paramètres
</button>

    </div>

    <script>

let notes=[];
let editIndex=-1;

function show(page){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(page).classList.add("active");
}

if(localStorage.getItem("notes")){
notes=JSON.parse(localStorage.getItem("notes"));
afficherNotes();
}

function afficherNotes(){

const zone=document.getElementById("notes");
zone.innerHTML="";

notes.forEach((note,index)=>{

zone.innerHTML+=`
<div class="noteCard" onclick="ouvrir(${index})">
<h3>${note.titre}</h3>
<p>${note.texte.substring(0,60)}...</p>
</div>
`;

});

}

document.querySelector(".new").onclick=function(){

editIndex=-1;

document.getElementById("title").value="";

document.getElementById("content").value="";

}

document.getElementById("saveBtn").onclick=function(){

const titre=document.getElementById("title").value.trim();
const texte=document.getElementById("content").value.trim();

if(titre=="" || texte==""){
alert("Remplis le titre et la note.");
return;
}

if(editIndex==-1){

notes.unshift({
titre:titre,
texte:texte
});

}else{

notes[editIndex]={
titre:titre,
texte:texte
};

editIndex=-1;

}

localStorage.setItem("notes",JSON.stringify(notes));

afficherNotes();

document.getElementById("title").value="";
document.getElementById("content").value="";

}

function ouvrir(i){

editIndex=i;

document.getElementById("title").value=notes[i].titre;
document.getElementById("content").value=notes[i].texte;

show("home");

}

document.getElementById("sendBtn").onclick=function(){

let titre=document.getElementById("title").value;
let texte=document.getElementById("content").value;

document.getElementById("iaText").innerHTML=
"<b>"+titre+"</b><br><br>"+texte;

show("ia");

}

document.querySelector("#settings button").onclick=function(){

if(confirm("Supprimer toutes les notes ?")){

notes=[];

localStorage.removeItem("notes");

afficherNotes();

document.getElementById("title").value="";
document.getElementById("content").value="";

}

}

</script>

</body>
</html>
