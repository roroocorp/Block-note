<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--accent:#10b981;
--accent2:#059669;
--glass:rgba(255,255,255,.08);
--border:rgba(255,255,255,.15);
}

body{
min-height:100vh;
background:linear-gradient(160deg,#071426,#10294d);
color:white;
font-family:'DM Sans',sans-serif;
}

.orb{
position:fixed;
border-radius:50%;
filter:blur(80px);
opacity:.25;
z-index:-1;
}

.orb1{
width:350px;
height:350px;
background:#10b981;
top:-100px;
right:-100px;
}

.orb2{
width:300px;
height:300px;
background:#059669;
bottom:-80px;
left:-80px;
}


header{
display:flex;
align-items:center;
gap:12px;
padding:18px;
border-bottom:1px solid var(--border);
}

.logo{
width:40px;
height:40px;
border-radius:12px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
}

h1{
font-size:18px;
}

h1 span{
color:#10b981;
}


#time{
margin-left:auto;
background:var(--glass);
padding:8px 12px;
border-radius:20px;
}


nav{
display:flex;
gap:8px;
padding:12px;
}


.nav{
flex:1;
padding:12px;
text-align:center;
background:var(--glass);
border:1px solid var(--border);
border-radius:14px;
cursor:pointer;
}


.nav.active{
background:linear-gradient(135deg,var(--accent),var(--accent2));
}


.page{
display:none;
padding:14px;
}


.page.active{
display:block;
}


.card{
background:var(--glass);
border:1px solid var(--border);
border-radius:18px;
padding:18px;
margin-bottom:15px;
}


.title{
font-weight:bold;
margin-bottom:12px;
}


input,select,textarea{

width:100%;
padding:13px;
border-radius:12px;
background:#0005;
color:white;
border:1px solid var(--border);
margin-bottom:10px;

}


button{

width:100%;
padding:12px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:white;
font-weight:bold;

}

</style>

</head>


<body>


<div class="orb orb1"></div>
<div class="orb orb2"></div>


<header>

<div class="logo">
⚡
</div>

<h1>
Daily Life <span>Ultra</span> IA
</h1>

<div id="time">
00:00:00
</div>

</header>



<nav>

<div class="nav active" onclick="openPage('home',this)">
🏠 Accueil
</div>


<div class="nav" onclick="openPage('ia',this)">
🤖 IA
</div>


<div class="nav" onclick="openPage('settings',this)">
⚙️ Paramètres
</div>


</nav>




<!-- ACCUEIL -->

<div id="home" class="page active">

<div class="card">

<div class="title">
📝 Mes notes
</div>


<input id="noteInput" placeholder="Écris une note...">


<button onclick="addNote()">
💾 Enregistrer
</button>


<div id="noteList"></div>


</div>



<div class="card">

<div class="title">
🌍 Langue
</div>


<select id="language">

<option>🇫🇷 Français</option>

<option>🇬🇧 English</option>

<option>🇪🇸 Español</option>

<option>🇩🇪 Deutsch</option>

<option>🇨🇳 中文</option>

</select>


</div>


</div>





<!-- IA -->

<div id="ia" class="page">


<div class="card">

<div class="title">
🤖 Assistant IA
</div>


<div id="chat">

🤖 Salut 👋 Je suis ton IA personnelle.

</div>


<br>


<input id="iaInput" placeholder="Écris un message...">


<button onclick="sendIA()">
🚀 Envoyer
</button>


</div>


</div>





<!-- PARAMETRES -->


<div id="settings" class="page">


<div class="card">

<div class="title">
🎨 Changer la couleur
</div>


<button onclick="changeTheme('#10b981','#059669')">
🟢 Vert
</button>

<br><br>

<button onclick="changeTheme('#3b82f6','#2563eb')">
🔵 Bleu
</button>

<br><br>

<button onclick="changeTheme('#a855f7','#7c3aed')">
🟣 Violet
</button>


</div>


<div class="card">

<div class="title">
⚡ Informations
</div>

<p>
Daily Life Ultra IA
</p>

<p>
Les notes restent sauvegardées.
</p>


</div>


</div>




<script>


/* HORLOGE */

function clock(){

let d=new Date();

document.getElementById("time").innerHTML=
d.toLocaleTimeString("fr-FR");

}

setInterval(clock,1000);
clock();



/* NAVIGATION */

function openPage(id,element){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});


document.getElementById(id).classList.add("active");


document.querySelectorAll(".nav").forEach(n=>{
n.classList.remove("active");
});


element.classList.add("active");

}



/* NOTES SAUVEGARDEES */

let notes=JSON.parse(localStorage.getItem("notes")) || [];


function showNotes(){

let box=document.getElementById("noteList");

box.innerHTML="";


notes.forEach((note,index)=>{


box.innerHTML+=`

<div style="
background:#0005;
padding:12px;
border-radius:12px;
margin-top:10px;
display:flex;
justify-content:space-between;
">

<span>${note}</span>

<button style="width:auto;background:#ef4444"
onclick="deleteNote(${index})">
❌
</button>

</div>

`;

});


}



function addNote(){

let input=document.getElementById("noteInput");


if(input.value.trim()==""){
return;
}


notes.push(input.value);


localStorage.setItem(
"notes",
JSON.stringify(notes)
);


input.value="";


showNotes();

}



function deleteNote(index){

notes.splice(index,1);


localStorage.setItem(
"notes",
JSON.stringify(notes)
);


showNotes();

}



showNotes();





/* IA */

function sendIA(){


let input=document.getElementById("iaInput");

let chat=document.getElementById("chat");


if(input.value.trim()==""){
return;
}


chat.innerHTML +=
"<br><br>👤 "+input.value;


chat.innerHTML +=
"<br>🤖 Je vais t'aider avec ça !";


input.value="";


}





/* CHANGER THEME */


function changeTheme(a,b){


document.documentElement.style.setProperty(
"--accent",
a
);


document.documentElement.style.setProperty(
"--accent2",
b
);


}




/* FIN DU FICHIER */


</script>


</body>

</html>
