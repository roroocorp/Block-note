<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Notes IA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b,#0f766e);
color:white;
min-height:100vh;
}


header{
padding:20px;
font-size:26px;
font-weight:bold;
text-align:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
}


nav{
display:flex;
justify-content:space-around;
padding:12px;
background:#111827;
position:sticky;
top:0;
}


nav button{
background:none;
border:none;
color:white;
font-size:15px;
padding:10px;
cursor:pointer;
transition:.2s;
}


nav button:hover{
color:#22c55e;
}


.page{
display:none;
padding:20px;
}


.active{
display:block;
}


/* Cartes plus visibles */

.card{
background:rgba(255,255,255,0.12);
border:1px solid rgba(255,255,255,0.25);
border-radius:22px;
padding:22px;
margin-bottom:25px;
backdrop-filter:blur(12px);
box-shadow:0 8px 25px rgba(0,0,0,0.35);
transition:.3s;
}


.card:hover{
transform:translateY(-4px);
box-shadow:0 12px 35px rgba(0,0,0,0.5);
}


.card h2{
margin-bottom:15px;
}


textarea{
width:100%;
height:220px;
border:none;
outline:none;
border-radius:15px;
padding:15px;
font-size:16px;
resize:none;
}


.send{
width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:15px;
background:#22c55e;
color:white;
font-size:17px;
cursor:pointer;
}


.send:hover{
opacity:.9;
}


.colors{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}


.color{
width:40px;
height:40px;
border-radius:50%;
cursor:pointer;
border:2px solid white;
}


select,input{
width:100%;
padding:12px;
border-radius:12px;
border:none;
font-size:16px;
margin-top:10px;
}


.reset{
width:100%;
padding:15px;
background:#ef4444;
border:none;
color:white;
font-size:17px;
border-radius:15px;
cursor:pointer;
}


.message{
background:#1f2937;
padding:15px;
border-radius:15px;
min-height:120px;
}

</style>

</head>

<body>

<header id="title">
📝 Daily Notes IA
</header>


<nav>

<button onclick="show('home')">
🏠 Accueil
</button>

<button onclick="show('ai')">
🤖 IA
</button>

<button onclick="show('promo')">
🎁 Promo
</button>

<button onclick="show('settings')">
⚙️ Paramètres
</button>

</nav>


<!-- ACCUEIL -->

<div id="home" class="page active">

<div class="card">

<h2 id="noteTitle">
📝 Bloc-notes
</h2>


<textarea id="note" placeholder="Écris ici..."></textarea>


<button class="send" id="sendBtn">
📤 Envoyer
</button>


</div>



<div class="card">

<h2 id="themeTitle">
🎨 Thème
</h2>


<div class="colors">

<div class="color" style="background:#22c55e"></div>

<div class="color" style="background:#3b82f6"></div>

<div class="color" style="background:#a855f7"></div>

<div class="color" style="background:#f97316"></div>

<div class="color" style="background:#ef4444"></div>

<div class="color" style="background:#eab308"></div>

</div>


</div>




<div class="card">

<h2 id="langTitle">
🌍 Langue
</h2>


<select id="language">

<option value="fr">
Français
</option>

<option value="en">
English
</option>

<option value="es">
Español
</option>

<option value="de">
Deutsch
</option>

<option value="it">
Italiano
</option>


</select>


</div>


</div>



<!-- IA -->


<div id="ai" class="page">


<div class="card">


<h2>
🤖 IA
</h2>


<div class="message" id="iaMessage">

Aucune note envoyée.

</div>


</div>


</div>




<!-- PROMO -->


<div id="promo" class="page">


<div class="card">


<h2>
🎁 Code Promo
</h2>


<input placeholder="Entrer un code">


<button class="send">
Valider
</button>


</div>


</div>




<!-- PARAMÈTRES -->


<div id="settings" class="page">


<div class="card">


<h2>
⚙️ Paramètres
</h2>


<button class="reset">
🗑 Réinitialiser la sauvegarde
</button>


</div>


</div>

    <script>

function show(page){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});

document.getElementById(page).classList.add("active");

}



// Sauvegarde automatique

const note=document.getElementById("note");

note.value=localStorage.getItem("note") || "";


note.oninput=function(){

localStorage.setItem("note",this.value);

};




// Bouton Envoyer + IA locale

document.getElementById("sendBtn").onclick=function(){

let texte=note.value.trim();

let ia=document.getElementById("iaMessage");


if(texte===""){

ia.innerHTML="🤖 Aucune note envoyée.";

}

else{

let mots=texte.toLowerCase();

let reponse="🧠 Analyse locale terminée. Pense à organiser tes prochaines actions.";


if(mots.includes("travail") || mots.includes("projet")){

reponse="💼 Conseil IA : divise ton projet en petites tâches pour avancer plus facilement.";

}


else if(mots.includes("stress") || mots.includes("fatigue")){

reponse="🌱 Conseil IA : prends du repos et garde un bon équilibre.";

}


else if(mots.includes("idée") || mots.includes("idee")){

reponse="💡 Bonne idée ! Note les détails pour pouvoir la développer.";

}



ia.innerHTML=
"<b>📝 Votre note :</b><br><br>"+
texte+
"<br><br><b>🤖 IA locale :</b><br>"+
reponse;

}


show("ai");

};





// Couleurs

document.querySelectorAll(".color").forEach(c=>{


c.onclick=function(){


let couleur=this.style.background;


document.querySelectorAll(".send").forEach(btn=>{

btn.style.background=couleur;

});


document.querySelector("header").style.color=couleur;


localStorage.setItem("theme",couleur);


};


});



let theme=localStorage.getItem("theme");


if(theme){

document.querySelectorAll(".send").forEach(btn=>{

btn.style.background=theme;

});


document.querySelector("header").style.color=theme;

}




// Langues

const txt={


fr:{

title:"📝 Daily Notes IA",
home:"🏠 Accueil",
ai:"🤖 IA",
promo:"🎁 Promo",
settings:"⚙️ Paramètres",
note:"📝 Bloc-notes",
theme:"🎨 Thème",
lang:"🌍 Langue",
send:"📤 Envoyer",
reset:"🗑 Réinitialiser la sauvegarde",
placeholder:"Écris ici..."

},


en:{

title:"📝 Daily Notes IA",
home:"🏠 Home",
ai:"🤖 AI",
promo:"🎁 Promo",
settings:"⚙️ Settings",
note:"📝 Notebook",
theme:"🎨 Theme",
lang:"🌍 Language",
send:"📤 Send",
reset:"🗑 Reset save",
placeholder:"Write here..."

}

};





document.getElementById("language").onchange=function(){

let l=this.value;

localStorage.setItem("lang",l);

updateLanguage(l);

};





function updateLanguage(l){

let t=txt[l] || txt.fr;


document.getElementById("title").innerHTML=t.title;


document.querySelectorAll("nav button")[0].innerHTML=t.home;

document.querySelectorAll("nav button")[1].innerHTML=t.ai;

document.querySelectorAll("nav button")[2].innerHTML=t.promo;

document.querySelectorAll("nav button")[3].innerHTML=t.settings;


document.getElementById("noteTitle").innerHTML=t.note;

document.getElementById("themeTitle").innerHTML=t.theme;

document.getElementById("langTitle").innerHTML=t.lang;

document.getElementById("sendBtn").innerHTML=t.send;

document.querySelector(".reset").innerHTML=t.reset;


note.placeholder=t.placeholder;


}





let langue=localStorage.getItem("lang") || "fr";


document.getElementById("language").value=langue;


updateLanguage(langue);





// Réinitialiser


document.querySelector(".reset").onclick=function(){


if(confirm("Supprimer toutes les données ?")){


localStorage.clear();

location.reload();


}


};



</script>


</body>
    </html>
