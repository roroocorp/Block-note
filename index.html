<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloc Notes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
transition:0.3s;
}

header{
background:#4a6cf7;
color:white;
padding:15px;
text-align:center;
font-size:28px;
}

nav{
display:flex;
justify-content:center;
gap:15px;
background:#222;
padding:10px;
}

nav button{
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
color:white;
background:#444;
}

nav button:hover{
background:#666;
}

.page{
display:none;
padding:20px;
}

.active{
display:block;
}

textarea{
width:100%;
height:350px;
padding:15px;
font-size:18px;
border-radius:10px;
resize:none;
}

select,input{
padding:10px;
margin:10px 0;
border-radius:8px;
}

.theme{
margin-top:20px;
}

footer{
text-align:center;
padding:15px;
margin-top:20px;
}
</style>

</head>

<body>

<header id="title">
Bloc Notes
</header>

<nav>
<button onclick="show('home')">Accueil</button>
<button onclick="show('ai')">IA</button>
<button onclick="show('promo')">Code Promo</button>
<button onclick="show('settings')">Paramètres</button>
</nav>

<div id="home" class="page active">

<h2>Bloc Notes</h2>

<textarea id="note" placeholder="Écris ici..."></textarea>

</div>

<div id="ai" class="page">

<h2>Assistant IA</h2>

<p>Ici tu pourras connecter une IA plus tard.</p>

</div>

<div id="promo" class="page">

<h2>Code Promo</h2>

<input type="text" placeholder="Entre un code promo">

<button>Valider</button>

</div>

<div id="settings" class="page">

<h2>Paramètres</h2>

<h3>Langue</h3>

<select onchange="changeLang(this.value)">
<option value="fr">Français</option>
<option value="en">English</option>
<option value="es">Español</option>
<option value="de">Deutsch</option>
</select>

<div class="theme">

<h3>Couleur</h3>

<input type="color" onchange="changeColor(this.value)">

</div>

</div>

<footer>
Bloc Notes 2026
</footer>

<script>

function show(page){

document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));

document.getElementById(page).classList.add("active");

}

const note=document.getElementById("note");

note.value=localStorage.getItem("note")||"";

note.oninput=()=>{

localStorage.setItem("note",note.value);

}

function changeColor(color){

document.querySelector("header").style.background=color;

}

function changeLang(lang){

const title=document.getElementById("title");

if(lang==="fr") title.innerHTML="Bloc Notes";

if(lang==="en") title.innerHTML="Notebook";

if(lang==="es") title.innerHTML="Bloc de Notas";

if(lang==="de") title.innerHTML="Notizblock";

}

</script>

</body>
</html>
