<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

</head>


<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>


<header>

<div class="logo">
⚡
</div>

<h1>
Daily Life <span>Ultra</span> IA
</h1>

<div id="time">
00:00:00
</div>

</header>



<nav>

<div class="nav active" onclick="openPage('home',this)">
🏠 Accueil
</div>


<div class="nav" onclick="openPage('ia',this)">
🤖 IA
</div>


<div class="nav" onclick="openPage('settings',this)">
⚙️ Paramètres
</div>


</nav>



<!-- PAGE ACCUEIL -->

<div id="home" class="page active">


<div class="card">

<div class="title">
📝 Mes notes
</div>


<input id="noteInput" placeholder="Écris une note...">


<button onclick="addNote()">
💾 Enregistrer
</button>


<div id="noteList"></div>


</div>



<div class="card">

<div class="title">
🌍 Langue
</div>


<select id="language">

<option value="fr">
🇫🇷 Français
</option>

<option value="en">
🇬🇧 English
</option>

<option value="es">
🇪🇸 Español
</option>

<option value="de">
🇩🇪 Deutsch
</option>

<option value="zh">
🇨🇳 中文
</option>


</select>


</div>



<div class="card">

<div class="title">
🎨 Couleur du thème
</div>


<button onclick="changeTheme('#10b981','#059669')">
🟢 Vert
</button>

<br><br>

<button onclick="changeTheme('#3b82f6','#2563eb')">
🔵 Bleu
</button>

<br><br>

<button onclick="changeTheme('#a855f7','#7c3aed')">
🟣 Violet
</button>


</div>



</div>





<!-- PAGE IA -->

<div id="ia" class="page">


<div class="card">

<div class="title">
🤖 Assistant IA
</div>


<div id="chat">

🤖 Salut 👋 Je suis ton IA personnelle.

</div>


<br>


<input id="iaInput" placeholder="Écris un message...">


<button onclick="sendIA()">
🚀 Envoyer
</button>


</div>


</div>





<!-- PAGE PARAMETRES -->

<div id="settings" class="page">


<div class="card">

<div class="title">
⚡ Informations
</div>


<p>
Daily Life Ultra IA
</p>


<p>
Tes notes restent sauvegardées automatiquement.
</p>


</div>


</div>
