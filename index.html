<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--accent:#10b981;
--accent2:#059669;
--bg:#071426;
--glass:rgba(255,255,255,.08);
--border:rgba(255,255,255,.12);
--text:#f0fdf4;
--muted:rgba(255,255,255,.55);
--radius:18px;
}

body{
min-height:100vh;
background:linear-gradient(160deg,#071426,#10294d);
color:var(--text);
font-family:'DM Sans',sans-serif;
overflow-x:hidden;
}


/* Lumières fond */

.orb{
position:fixed;
border-radius:50%;
filter:blur(90px);
opacity:.25;
z-index:0;
}

.orb1{
width:350px;
height:350px;
background:var(--accent);
top:-100px;
right:-80px;
}

.orb2{
width:300px;
height:300px;
background:var(--accent2);
bottom:-80px;
left:-80px;
}


/* HEADER */

header{
position:relative;
z-index:2;
display:flex;
align-items:center;
gap:12px;
padding:18px;
border-bottom:1px solid var(--border);
backdrop-filter:blur(15px);
}

.logo{
width:38px;
height:38px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
}

h1{
font-family:'Syne',sans-serif;
font-size:18px;
font-weight:800;
}

h1 span{
color:var(--accent);
}

#time{
margin-left:auto;
background:var(--glass);
padding:7px 13px;
border-radius:20px;
font-size:13px;
color:var(--muted);
}


/* MENU */

#menu{
position:relative;
z-index:2;
display:flex;
gap:8px;
padding:12px;
}

.menu{
flex:1;
padding:12px;
border-radius:14px;
text-align:center;
background:var(--glass);
border:1px solid var(--border);
cursor:pointer;
color:var(--muted);
transition:.2s;
}

.menu.active{
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:white;
font-weight:bold;
}


/* PAGE */

.page{
display:none;
padding:14px;
position:relative;
z-index:2;
}

.page.active{
display:block;
}


/* CARDS */

.card{
background:var(--glass);
border:1px solid var(--border);
border-radius:var(--radius);
padding:18px;
margin-bottom:15px;
backdrop-filter:blur(12px);
}


.title{
font-family:'Syne',sans-serif;
font-weight:700;
margin-bottom:15px;
}


/* INPUT */

input,select,textarea{

width:100%;
padding:13px;
border-radius:14px;
border:1px solid var(--border);
background:rgba(0,0,0,.25);
color:white;
outline:none;
font-size:14px;

}

textarea{
resize:none;
}


/* BUTTON */

button{

border:none;
cursor:pointer;
border-radius:14px;
padding:12px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:white;
font-weight:bold;

}


/* NOTES */

.note{

background:rgba(0,0,0,.25);
border:1px solid var(--border);
border-radius:14px;
padding:12px;
margin-top:10px;

display:flex;
align-items:center;
gap:10px;

}


.note span{

flex:1;

}


.note button{

padding:8px 10px;
font-size:12px;

}


.done{

opacity:.5;
text-decoration:line-through;

}


/* THEMES */

.colors{

display:flex;
gap:10px;
flex-wrap:wrap;

}


.color{

width:35px;
height:35px;
border-radius:50%;
cursor:pointer;
border:2px solid transparent;

}


.color.active{

border-color:white;
transform:scale(1.15);

}

</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<header>

<div class="logo">⚡</div>

<h1>
Daily Life <span>Ultra</span> IA
</h1>

<div id="time">
00:00:00
</div>

</header>


<div id="menu">

<div class="menu active" onclick="page('home',this)">
🏠 Accueil
</div>

<div class="menu" onclick="page('ia',this)">
🤖 IA
</div>

<div class="menu" onclick="page('promo',this)">
🎁 Promo
</div>

</div>
