<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --accent:#10b981;
    --accent2:#059669;
    --bg1:#081525;
    --bg2:#102746;

    --glass:rgba(255,255,255,.07);
    --glass2:rgba(255,255,255,.13);

    --border:rgba(255,255,255,.12);

    --text:#f0fdf4;
    --muted:rgba(255,255,255,.55);

    --radius:20px;
    --radius-sm:14px;
}


body{

    min-height:100vh;

    background:
    radial-gradient(circle at top right,#12395a,transparent 35%),
    linear-gradient(160deg,var(--bg1),var(--bg2));

    color:var(--text);

    font-family:'DM Sans',sans-serif;

    display:flex;
    flex-direction:column;

    overflow-x:hidden;

}


/* =========================
   BACKGROUND ORBS
========================= */


.orb{

    position:fixed;

    border-radius:50%;

    filter:blur(90px);

    opacity:.25;

    pointer-events:none;

    z-index:0;

}


.orb1{

    width:350px;
    height:350px;

    top:-120px;
    right:-100px;

    background:var(--accent);

}


.orb2{

    width:300px;
    height:300px;

    bottom:-100px;
    left:-100px;

    background:var(--accent2);

}



/* =========================
   HEADER
========================= */


header{

    position:relative;

    z-index:5;

    display:flex;

    align-items:center;

    gap:12px;

    padding:18px;

    border-bottom:1px solid var(--border);

    backdrop-filter:blur(15px);

}


.logo{

    width:38px;
    height:38px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

    background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));

}


h1{

    font-family:'Syne',sans-serif;

    font-size:18px;

    font-weight:800;

    letter-spacing:-.5px;

}


h1 span{

    color:var(--accent);

}


#time{

    margin-left:auto;

    padding:6px 12px;

    border-radius:30px;

    background:var(--glass);

    border:1px solid var(--border);

    color:var(--muted);

    font-size:13px;

}



/* =========================
   NAVIGATION
========================= */


#topNav{

    position:relative;

    z-index:5;

    display:flex;

    gap:10px;

    padding:14px;

}


.navBox{

    flex:1;

    text-align:center;

    padding:12px 5px;

    border-radius:var(--radius-sm);

    background:var(--glass);

    border:1px solid var(--border);

    color:var(--muted);

    cursor:pointer;

    transition:.25s;

    font-size:14px;

}


.navBox:hover{

    background:var(--glass2);

}


.navBox.active{

    background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));

    color:white;

    font-weight:700;

}



/* =========================
   PAGES
========================= */


.page{

    display:none;

    flex-direction:column;

    gap:14px;

    padding:14px;

    position:relative;

    z-index:2;

}


.page.active{

    display:flex;

}



/* =========================
   CARDS
========================= */


.card{

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:18px;

    backdrop-filter:blur(12px);

}


.card-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

    font-family:'Syne',sans-serif;

    font-weight:700;

}


.icon{

    width:30px;

    height:30px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:10px;

    background:var(--glass2);

}
<style>

/* =========================
   INPUTS
========================= */


input,
select,
textarea{

    width:100%;

    padding:13px 15px;

    border-radius:var(--radius-sm);

    border:1px solid var(--border);

    background:rgba(0,0,0,.25);

    color:var(--text);

    font-family:'DM Sans',sans-serif;

    font-size:14px;

    outline:none;

    transition:.2s;

}


input:focus,
select:focus,
textarea:focus{

    border-color:var(--accent);

}


option{

    background:#102746;

}



/* =========================
   BUTTONS
========================= */


.btn{

    width:100%;

    padding:13px;

    margin-top:10px;

    border:none;

    border-radius:var(--radius-sm);

    background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));

    color:white;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

}


.btn:hover{

    transform:translateY(-2px);

    opacity:.9;

}



/* =========================
   COLORS
========================= */


.swatches{

    display:flex;

    flex-wrap:wrap;

    gap:10px;

}


.swatch{

    width:38px;

    height:38px;

    border-radius:12px;

    cursor:pointer;

    border:2px solid transparent;

    transition:.2s;

}


.swatch.selected{

    border-color:white;

    transform:scale(1.12);

}



/* =========================
   STATS
========================= */


.stat-row{

    display:flex;

    gap:10px;

}


.stat-box{

    flex:1;

    padding:14px;

    border-radius:var(--radius-sm);

    background:var(--glass);

    border:1px solid var(--border);

    text-align:center;

}


.stat-box .number{

    font-family:'Syne';

    font-size:24px;

    font-weight:800;

    color:var(--accent);

}


.stat-box .label{

    color:var(--muted);

    font-size:12px;

}



/* =========================
   TASKS
========================= */


.task{

    display:flex;

    align-items:center;

    gap:10px;

    padding:12px;

    margin-top:8px;

    border-radius:var(--radius-sm);

    background:rgba(0,0,0,.22);

    border:1px solid var(--border);

    animation:appear .25s ease;

}


@keyframes appear{

    from{

        opacity:0;

        transform:translateY(-8px);

    }

    to{

        opacity:1;

        transform:none;

    }

}


.task-check{

    width:22px;

    height:22px;

    border-radius:7px;

    border:2px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    flex-shrink:0;

}


.task.done .task-check{

    background:var(--accent);

    border-color:var(--accent);

}


.task.done .task-text{

    text-decoration:line-through;

    opacity:.45;

}


.task-text{

    flex:1;

    font-size:14px;

}


.task-delete{

    cursor:pointer;

    opacity:.5;

    font-size:16px;

}


.task-delete:hover{

    opacity:1;

}


.empty{

    text-align:center;

    padding:15px;

    color:var(--muted);

    font-size:13px;

}



/* =========================
   IA CHAT
========================= */


.ia-page-inner{

    height:calc(100vh - 170px);

    display:flex;

    flex-direction:column;

}


.chips{

    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-bottom:10px;

}


.chip{

    padding:7px 13px;

    border-radius:20px;

    background:var(--glass);

    border:1px solid var(--border);

    color:var(--muted);

    font-size:12px;

    cursor:pointer;

}



#chatContainer{

    flex:1;

    overflow-y:auto;

    display:flex;

    flex-direction:column;

    gap:10px;

    padding:8px;

}



/* messages */


.message{

    max-width:80%;

    padding:12px 15px;

    border-radius:18px;

    line-height:1.5;

    font-size:14px;

}


.userMsg{

    align-self:flex-end;

    background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));

}


.iaMsg{

    align-self:flex-start;

    background:var(--glass2);

    border:1px solid var(--border);

}



/* =========================
   IA INPUT
========================= */


#iaInputArea{

    display:flex;

    gap:8px;

    align-items:center;

    padding:8px;

    border-radius:22px;

    background:var(--glass);

    border:1px solid var(--border);

}


#iaInput{

    flex:1;

    background:transparent;

    border:none;

}


.iconBtn{

    width:38px;

    height:38px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    border:none;

}


.sendBtn{

    background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));

}


.attachBtn{

    background:rgba(255,255,255,.1);

    color:white;

    font-size:20px;

    }
