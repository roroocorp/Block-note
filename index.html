<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

:root{
--accent:#10b981;
--accent2:#059669;
--bg1:#0a1628;
--bg2:#0f2040;
--glass:rgba(255,255,255,.07);
--glass2:rgba(255,255,255,.13);
--border:rgba(255,255,255,.1);
--text:#f0fdf4;
--muted:rgba(255,255,255,.5);
--radius:18px;
--radius-sm:12px;
}


body{
min-height:100vh;
background:var(--bg1);
color:var(--text);
font-family:'DM Sans',sans-serif;
display:flex;
flex-direction:column;
overflow-x:hidden;
}


/* FONDS */

.orb{
position:fixed;
border-radius:50%;
filter:blur(80px);
opacity:.18;
pointer-events:none;
z-index:0;
}

.orb1{
width:340px;
height:340px;
top:-80px;
right:-60px;
background:var(--accent);
}

.orb2{
width:280px;
height:280px;
bottom:60px;
left:-80px;
background:var(--accent2);
}


/* HEADER */

header{
position:relative;
z-index:10;
display:flex;
align-items:center;
gap:10px;
padding:16px 18px 12px;
border-bottom:1px solid var(--border);
backdrop-filter:blur(12px);
}

.logo-dot{
width:34px;
height:34px;
border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
}

header h1{
font-family:'Syne',sans-serif;
font-size:17px;
font-weight:800;
}

header h1 span{
color:var(--accent);
}


#time{
margin-left:auto;
font-size:13px;
color:var(--muted);
background:var(--glass);
padding:5px 12px;
border-radius:20px;
border:1px solid var(--border);
}


/* NAV */

#topNav{
position:relative;
z-index:10;
display:flex;
gap:8px;
padding:12px 14px;
}

.navBox{
flex:1;
padding:11px 0;
background:var(--glass);
border:1px solid var(--border);
border-radius:12px;
text-align:center;
font-size:14px;
cursor:pointer;
color:var(--muted);
}


.navBox.active{
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:white;
font-weight:700;
}


/* PAGES */

.page{
display:none;
flex-direction:column;
padding:14px;
position:relative;
z-index:5;
flex:1;
}


.page.active{
display:flex;
}


/* CARTES */

.card{
background:var(--glass);
border:1px solid var(--border);
border-radius:var(--radius);
padding:18px;
margin-bottom:14px;
backdrop-filter:blur(8px);
}


.card-title{
font-family:'Syne',sans-serif;
font-size:15px;
font-weight:700;
margin-bottom:14px;
display:flex;
align-items:center;
gap:8px;
}


.icon{
width:28px;
height:28px;
background:var(--glass2);
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
}


/* ⬇️ SUITE PARTIE 2 ⬇️ */
