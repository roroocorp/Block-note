<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Life Ultra IA</title>

<style>

/* TON CSS DU DESIGN ICI */
/* Garde tout ton style actuel */

</style>

</head>

<body>


<div class="orb orb1"></div>
<div class="orb orb2"></div>


<header>

<div class="logo-dot">⚡</div>

<h1>Daily Life <span>Ultra</span> IA</h1>

<div id="time">00:00:00</div>

</header>


<div id="topNav">

<div class="navBox active" onclick="showPage('home',this)">
🏠 Accueil
</div>

<div class="navBox" onclick="showPage('ia',this)">
🤖 IA
</div>

<div class="navBox" onclick="showPage('promo',this)">
🎁 Promo
</div>

</div>



<!-- ACCUEIL -->

<div id="home" class="page active">


<div class="stat-row">

<div class="stat-box">
<div class="n" id="statTotal">0</div>
<div class="l" id="txtTasks">Tâches</div>
</div>


<div class="stat-box">
<div class="n" id="statDone">0</div>
<div class="l" id="txtDone">Terminées</div>
</div>


<div class="stat-box">
<div class="n" id="statLeft">0</div>
<div class="l" id="txtLeft">Restantes</div>
</div>

</div>



<div class="card">

<div class="card-title">
<div class="icon">🌍</div>
Langue
</div>


<select id="languageSelect">

<option value="fr">🇫🇷 Français</option>

<option value="en">🇬🇧 English</option>

<option value="es">🇪🇸 Español</option>

<option value="de">🇩🇪 Deutsch</option>

<option value="zh">🇨🇳 中文</option>

</select>


</div>



<div class="card">

<div class="card-title">
<div class="icon">✅</div>

<span id="lblTasks">
Tâches du jour
</span>

</div>


<div style="display:flex;gap:8px">

<input 
id="taskInput"
placeholder="Ajouter une tâche..."
>


<button class="btn" onclick="addTask()">
+
</button>


</div>


<div id="taskList"></div>


</div>


</div>





<!-- IA -->

<div id="ia" class="page">


<div id="chatContainer">


<div class="message iaMsg">

Salut 👋 Je suis ton IA perso !

</div>


</div>



<div id="iaInputArea">


<textarea 
id="iaInput"
placeholder="Écris un message..."
></textarea>


<button class="iconBtn sendBtn" onclick="askIA()">

➤

</button>


</div>



</div>






<!-- PROMO -->

<div id="promo" class="page">


<div class="card">


<div class="card-title">

🎁 
<span id="lblPromo">
Valider un code
</span>

</div>


<input id="promoInput" placeholder="Entre ton code promo...">


<button class="btn" onclick="validatePromo()">

Valider

</button>


<div id="promoResult"></div>


</div>


</div>





<footer>

© 2026 Daily Life Ultra IA ⚡

</footer>




<script>

/* HORLOGE */

function tick(){

let d=new Date();

document.getElementById("time").textContent =
d.toLocaleTimeString("fr-FR");

}

tick();

setInterval(tick,1000);



/* NAVIGATION */

function showPage(id,el){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(id).classList.add("active");


document.querySelectorAll(".navBox")
.forEach(b=>b.classList.remove("active"));

el.classList.add("active");

}




/* LANGUES */

const T={

fr:{
task:"Ajouter une tâche...",
write:"Écris un message...",
tasks:"Tâches du jour",
promo:"Valider un code"
},


en:{
task:"Add a task...",
write:"Write a message...",
tasks:"Today's tasks",
promo:"Validate code"
},


es:{
task:"Añadir tarea...",
write:"Escribe un mensaje...",
tasks:"Tareas del día",
promo:"Validar código"
},


de:{
task:"Aufgabe hinzufügen...",
write:"Nachricht schreiben...",
tasks:"Heutige Aufgaben",
promo:"Code prüfen"
},


zh:{
task:"添加任务...",
write:"输入消息...",
tasks:"今日任务",
promo:"验证代码"
}


};



document.getElementById("languageSelect")
.addEventListener("change",function(){


let l=this.value;


document.getElementById("taskInput")
.placeholder=T[l].task;


document.getElementById("iaInput")
.placeholder=T[l].write;


document.getElementById("lblTasks")
.textContent=T[l].tasks;


document.getElementById("lblPromo")
.textContent=T[l].promo;


});





/* NOTES SAUVEGARDÉES */

let tasks=
JSON.parse(localStorage.getItem("tasks") || "[]");



function saveTasks(){

localStorage.setItem(
"tasks",
JSON.stringify(tasks)
);

}




function renderTasks(){

let list=document.getElementById("taskList");


if(tasks.length===0){

list.innerHTML=
"<p>Aucune tâche 🎉</p>";

}

else{


list.innerHTML=tasks.map((t,i)=>`


<div class="task">


<div onclick="toggleTask(${i})">

${t.done ? "✅":"⬜"}

</div>


<div class="task-text">

${t.text}

</div>


<div 
class="task-del"
onclick="delTask(${i})">

🗑️

</div>


</div>


`).join("");

}



let done=tasks.filter(t=>t.done).length;


document.getElementById("statTotal")
.textContent=tasks.length;


document.getElementById("statDone")
.textContent=done;


document.getElementById("statLeft")
.textContent=tasks.length-done;


}



function addTask(){

let input=document.getElementById("taskInput");


if(input.value.trim()=="") return;


tasks.unshift({

text:input.value,

done:false

});


input.value="";


saveTasks();

renderTasks();

}



function delTask(i){

tasks.splice(i,1);

saveTasks();

renderTasks();

}



function toggleTask(i){

tasks[i].done=!tasks[i].done;

saveTasks();

renderTasks();

}


renderTasks();





/* IA SIMPLE */

function askIA(){


let input=document.getElementById("iaInput");

let text=input.value.trim();


if(!text)return;



let chat=document.getElementById("chatContainer");



chat.innerHTML+=`

<div class="message userMsg">

${text}

</div>

`;



chat.innerHTML+=`

<div class="message iaMsg">

Je réfléchis 🤖... Je vais t'aider !

</div>

`;



input.value="";


chat.scrollTop=chat.scrollHeight;


}





/* PROMO */

function validatePromo(){

let code=document.getElementById("promoInput").value;


let result=document.getElementById("promoResult");


if(code=="DAILY2026"){


result.innerHTML="✅ Code valide !";


}

else{


result.innerHTML="❌ Code incorrect";


}


}


</script>


</body>
</html>
